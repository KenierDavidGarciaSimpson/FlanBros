spring.application.name=demo

# ---- Servidor ----
# Render (y otros hostings) indican el puerto en la variable PORT; en local queda 8080.
server.port=${PORT:8080}
# Detras del proxy HTTPS de Render: respeta X-Forwarded-Proto para saber que la conexion es segura.
server.forward-headers-strategy=framework

# ---- Base de datos (PostgreSQL 16). Sobrescribe con variables de entorno en cada equipo/servidor ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flanbross}
spring.datasource.username=${DB_USUARIO:flanbross}
spring.datasource.password=${DB_CLAVE:flanbross}

# ---- Migraciones Flyway ----
# db/migration = esquema + datos de referencia (siempre).
# db/demo      = clientes, personal y pedidos de ejemplo. QUITAR en produccion:
#                spring.flyway.locations=classpath:db/migration
spring.flyway.locations=classpath:db/migration,classpath:db/demo

# ---- Imagenes subidas desde el panel ----
flanbross.carpeta-imagenes=carpeta-imagenes

# ---- Sesion y seguridad ----
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# En produccion con HTTPS: COOKIE_SEGURA=true
server.servlet.session.cookie.secure=${COOKIE_SEGURA:false}

# DEMO: sin servidor de correo, recuperar.html recibe el token en la respuesta.
# INSEGURO: permite cambiar la clave de cualquier cuenta. En produccion: false.
flanbross.recuperacion.mostrar-token=${MOSTRAR_TOKEN_RECUPERACION:true}
