spring.application.name=demo

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/flanbross}
spring.datasource.username=${DB_USUARIO:flanbross}
spring.datasource.password=${DB_CLAVE:flanbross}

spring.flyway.locations=classpath:db/migration,classpath:db/demo

flanbross.carpeta-imagenes=carpeta-imagenes

server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SEGURA:false}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
flanbross.recuperacion.correo-remitente=${MAIL_REMITENTE:}
flanbross.recuperacion.brevo-api-key=${BREVO_API_KEY:}

flanbross.recuperacion.mostrar-token=${MOSTRAR_TOKEN_RECUPERACION:false}
